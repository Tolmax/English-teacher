<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест — English Teacher</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./class.html">1 класс</a>
    <button class="menu-button" type="button" aria-label="Открыть меню">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="page page--narrow">
    <section class="page-hero page-hero--compact">
      <div>
        <p class="eyebrow">Интерактивный тест</p>
        <h1>Тест</h1>
        <p class="hero__lead">10 вопросов. После выбора ответ фиксируется, чтобы результат был честным.</p>
      </div>
    </section>

    <section class="soft-section quiz">
      <div class="quiz__top">
        <span>Вопрос 1 из 10</span>
        <strong>Балл: 0</strong>
      </div>
      <h2>Choose the correct translation: dog</h2>
      <form class="answer-list" action="#">
        <label><input type="radio" name="answer"> собака</label>
        <label><input type="radio" name="answer"> кошка</label>
      </form>
      <p class="quiz__note">После ответа появится подсказка: правильно или нет.</p>
      <button class="class-picker__button" type="button">Следующий вопрос</button>
    </section>
  </main>
</body>
</html>
